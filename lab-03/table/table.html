<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>table</title>
    <style type="text/css">
        table { border-collapse: collapse; width: 400px;}
        td { border: 2px solid #000; }
        tr {width: 60px; height: 60px; }
    </style>
</head>
<body>
  <div  align="center">
    <table>
  <tr>
    <td colspan="8" bgcolor="#2ef1cd"><br/></td>
  </tr>

  <tr>
    <td rowspan="6" bgcolor="#fef8c7"><br></td>
    <td colspan="6" bgcolor="#2ef1cd"><br></td>
    <td rowspan="6" bgcolor="#fef8c7"><br></td>
  </tr>

   <tr>
   <td rowspan="4" bgcolor="#fef8c7"><br/></td> 
   <td colspan="4" bgcolor="#2ef1cd"><br/></td>
   <td rowspan="4" bgcolor="#fef8c7"><br/></td> 
   </tr>
   
    <tr>
    <td rowspan="2" bgcolor="#fef8c7"><br/></td> 
    <td bgcolor="#eb4034"><br/></td>                 
    <td bgcolor="#0000ff"><br/></td>             
    <td rowspan="2" bgcolor="#fef8c7"><br/></td> 
   </tr>

   <tr>
    <td bgcolor="#55eb34"><br/></td>
    <td bgcolor="#ebeb34"><br/></td>
   </tr>
     
   <tr>
       <td colspan="4" bgcolor="#2ef1cd"><br/></td> 
   </tr>

   <tr>
       <td colspan="6" bgcolor="#2ef1cd"><br/></td> 
   </tr>

   <tr>
       <td colspan="8" bgcolor="#2ef1cd"><br/></td> 
   </tr>
    </table>
    <br>
    <p><a href="../index.html">Повернутись на головну</a></p>
  </div>
</body>
</html>
