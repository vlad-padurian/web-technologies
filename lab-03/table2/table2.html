<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>table2</title>
  <style type="text/css">
    table { border-collapse: collapse; width: 400px;}
    td { border: 5px solid #000; }
    tr {width: 60px; height: 60px; }
  </style>
</head>
<body>
    <div align="center">
  <table>

    <tr>
      <td colspan="2" bgcolor="#ffffff"><br/></td>
      <td colspan="4" bgcolor="#ffffff"><br/></td>
      <td colspan="3" bgcolor="#fffa69"><br/></td>
    </tr>
    
      <td bgcolor="#ffffff"><br/></td>
      <td colspan="5" rowspan="2" bgcolor="#ff5b2d"><br/></td>
      <td colspan="3" bgcolor="#fffa69"><br/></td>
    </tr>
    
      <td bgcolor="#ffffff"><br/></td>
      <td colspan="2" bgcolor="#ffffff"><br/></td>
      <td bgcolor="#ffffff"><br/></td>
    </tr>

    <tr>
      <td bgcolor="#ffffff"><br/></td>
      <td colspan="2" rowspan="2" bgcolor="#000000"><br/></td>
      <td colspan="3" bgcolor="#ffffff"><br/></td>
      <td colspan="3" bgcolor="#ffffff"><br/></td>
    </tr>
    
    <tr>
      <td rowspan="2" bgcolor="#fffa69"><br/></td>
      <td colspan="3" bgcolor="#ffffff"><br/></td>
      <td colspan="3" bgcolor="#074481"><br/></td>
    </tr>
    
    <tr>
      <td bgcolor="#ffffff"><br/></td>
      <td colspan="3" bgcolor="#000000"><br/></td>
      <td colspan="4" bgcolor="#ffffff"><br/></td>
    </tr>
  </table>
  <br>
  <p><a href="../index.html">Повернутись на головну</a></p>
    </div>
</body>
</html>
